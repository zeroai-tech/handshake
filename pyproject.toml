[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handshake-vault"
version = "1.0.0"
description = "An encrypted credential vault for people who work with AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "ZeroAI Technologies" }]
keywords = ["secrets", "credentials", "vault", "encryption", "2fa", "totp",
            "ai-agents", "mcp", "security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

# Deliberately minimal. Every dependency is one more thing that has to install
# on a freshly wiped machine during a recovery.
dependencies = [
  "cryptography>=41",   # AES-GCM
  "qrcode>=7.4",        # pure-Python; renders the 2FA enrolment code locally
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/zeroai-tech/handshake"
Issues = "https://github.com/zeroai-tech/handshake/issues"
Security = "https://github.com/zeroai-tech/handshake/security/policy"

[project.scripts]
handshake = "handshake:main"

[tool.setuptools]
packages = ["hsvault", "hsvault.backends"]
py-modules = ["handshake"]
