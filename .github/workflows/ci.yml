name: tests

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - name: unit tests
        run: python tests/test_vault.py
      - name: encryption and atomic-write regressions
        run: python tests/test_hardening.py
      - name: local GUI authorization and recovery
        run: python tests/test_gui.py
      - name: end-to-end CLI tests
        run: python tests/e2e.py
        env:
          HANDSHAKE_TEST_PYTHON: python

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: pip install -e .
      - run: npm install --prefix .browser-tests --no-package-lock playwright@1.61.1
      - run: .browser-tests/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/verify_gui.cjs "$GITHUB_WORKSPACE/.browser-tests/node_modules/playwright"
        env:
          HANDSHAKE_TEST_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-screenshots
          path: output/*.png

  install:
    # The installer is the first thing every user runs; a break here is a
    # break for everyone, so exercise the real script end to end.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: install from this checkout
        run: |
          set -euo pipefail
          bash install.sh
        env:
          HANDSHAKE_APP: ${{ runner.temp }}/hs-app
          HANDSHAKE_BIN: ${{ runner.temp }}/hs-bin
      - name: the installed binary runs, through its symlink
        run: |
          set -euo pipefail
          "${{ runner.temp }}/hs-bin/handshake" --version
          HANDSHAKE_HOME="${{ runner.temp }}/hs-home" \
          HANDSHAKE_BACKEND=sqlite \
          HANDSHAKE_SQLITE_PATH="${{ runner.temp }}/hs.db" \
            "${{ runner.temp }}/hs-bin/handshake" status

  no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: fail if anything secret-shaped is committed
        run: |
          if git grep -nIE '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . ':!README.md' ':!tests/*'; then
            echo "::error::possible secret committed"; exit 1
          fi
          echo "clean"
